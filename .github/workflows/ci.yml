name: ci

# Three gates, run on every push and PR so nothing drifts in silently.
#
#   lint              - the source-of-truth gate: .sh/.ps1 twin parity, disk == manifest,
#                       skill frontmatter, reference resolution, the no-framing guard.
#                       The lint is dependency-free by design, so there is no install step
#                       and no lockfile question - node + `npm run lint` is the whole job.
#   installer-linux   - the .sh actually RUNS - skills-only, a full install over the clone
#                       fallback, and a full install over a SERVED release archive. Both source
#                       routes are covered on purpose: a local STACK_SOURCE_REPO has no releases,
#                       so it only ever exercises the fallback - the archive route (what real
#                       consumers take) would otherwise ship untested.
#   installer-windows - the .ps1 actually RUNS, on a native x86 PowerShell - the only place the
#                       Windows-only branches (winget, WindowsApps) are real. A dev box can run
#                       the twin under a native pwsh (homebrew ships an arm64 build; only the
#                       amd64 *Docker image* is unusable on Apple Silicon, dying in .NET's PAL
#                       under emulation), but that exercises the POSIX branches, not these. A
#                       parse pass catches syntax on EVERY branch, including the ones no run
#                       reaches; the run then proves the install path end to end.
#
# Both installer jobs drive `install skills-only` (which exits before the prerequisite check) and
# then a full `install`. STACK_SOURCE_REPO / STACK_SKILLS_REPO point at the checkout, so the run
# is offline and deterministic - it tests THIS commit's artifacts, not whatever is on main. A
# local path has no releases, so that route is the clone fallback; the archive route is covered
# separately by serving a real snapshot of THIS commit over localhost.
# Both twins resolve the target project with `git rev-parse --show-toplevel`, so the fixture
# has to be a real git repo, not a bare directory.

# develop carries the work; merging develop -> main IS the release act (release.yml rebuilds the
# rolling 'latest' archive from that merge, and that revision is what every install delivers). So
# gate both: every push to develop, every push to main, and every PR into either.
#
# main is on the push trigger deliberately, where the peer stack drops it: release.yml publishes
# from a main push on its own, with no gate of its own, so CI here is the only signal that the
# revision consumers just received is green. It cannot block that publish - workflows are
# independent - but a red main is worth knowing about immediately. Feature branches get their
# coverage from the PR they open, not from every push.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run lint

  installer-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax
        run: bash -n scripts/cursor-stack.sh

      - name: install skills-only into a throwaway project
        env:
          STACK_SKILLS_REPO: ${{ github.workspace }}
        run: |
          set -euo pipefail
          proj="$RUNNER_TEMP/proj"
          mkdir -p "$proj" && cd "$proj"
          git init -q . && git config user.email ci@example.com && git config user.name ci
          bash "$GITHUB_WORKSPACE/scripts/cursor-stack.sh" install skills-only

          # The manifest is the contract: every active entry must land as a real skill dir.
          expected=$(grep -c '"envoydev/cursor-stack|' "$GITHUB_WORKSPACE/scripts/cursor-stack.sh")
          actual=$(find "$proj/.cursor/skills" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          echo "manifest entries: $expected | installed skill dirs: $actual"
          test "$actual" = "$expected"
          test -f "$proj/.cursor/skills/create-ticket/SKILL.md"
          echo "installer-linux: install path OK"

      - name: full install (clone fallback) - one source serves the whole tree, and stamps it
        env:
          STACK_SOURCE_REPO: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # The fallback clone is pinned to -b main (the release branch), but actions/checkout
          # fetches only the triggering ref - so refs/heads/main does not exist on a develop run
          # and the clone would find no branch. Point a local main at THIS commit: the pin is
          # exercised AND the fixture still tests the artifacts under test rather than whatever
          # real main holds. (That the pin actually PREFERS main over the current branch is a
          # different claim, proven by the pin-honored step below.)
          git -C "$GITHUB_WORKSPACE" branch -f main HEAD

          proj="$RUNNER_TEMP/full"
          mkdir -p "$proj" && cd "$proj"
          git init -q . && git config user.email ci@example.com && git config user.name ci
          bash "$GITHUB_WORKSPACE/scripts/cursor-stack.sh" install 2>&1 | tee run.log

          # The whole point of the source snapshot: ONE resolution, and every hook/rule/agent copied
          # out of it rather than fetched per-file. A regression here is silent, so assert it.
          test "$(grep -cE 'source: (release archive|clone fallback)' run.log)" = 1
          grep -q 'source: clone fallback' run.log   # a local path has no releases - this IS the fallback
          test "$(grep -c 'fetched ->' run.log)" = 0
          agents=$(ls "$proj/.cursor/agents"/*.md | wc -l | tr -d ' ')
          rules=$(ls "$proj/.cursor/rules"/*.mdc | wc -l | tr -d ' ')
          hooks=$(ls "$proj/.cursor/hooks"/*.js | wc -l | tr -d ' ')
          echo "agents=$agents rules=$rules hooks=$hooks copied=$(grep -c 'copied ->' run.log)"
          test "$agents" = "$(awk '/^CURSOR_AGENTS=\(/,/^\)/' "$GITHUB_WORKSPACE/scripts/cursor-stack.sh" | grep -c '^  "')"
          test "$rules"  = "$(awk '/^CURSOR_RULES=\(/,/^\)/'  "$GITHUB_WORKSPACE/scripts/cursor-stack.sh" | grep -c '^  "')"
          test "$hooks"  = "$(awk '/^CURSOR_HOOKS=\(/,/^\)/'  "$GITHUB_WORKSPACE/scripts/cursor-stack.sh" | grep -c '^  "')"

          # The stamp must name the commit actually installed - not a stale or invented one.
          grep -q "^source_commit=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)$" "$proj/.cursor/cursor-stack.stamp"
          echo "installer-linux: full tree + stamp OK"

      # The claim -b main actually buys: a consumer never gets unreleased work. The step above
      # points main at HEAD, so it proves the pin RUNS but not that it PREFERS main - this one
      # uses a fixture where the two branches genuinely differ.
      - name: fallback clone is pinned to main - develop work stays invisible
        run: |
          set -euo pipefail
          fx="$RUNNER_TEMP/fx"
          mkdir -p "$fx/skills" "$fx/agents" && cd "$fx"
          git init -q -b main . && git config user.email ci@example.com && git config user.name ci
          echo main > agents/marker.md && git add -A && git commit -qm main
          main_sha=$(git rev-parse HEAD)
          git checkout -qb develop && echo develop > agents/marker.md && git commit -qam develop
          dev_sha=$(git rev-parse HEAD)
          test "$main_sha" != "$dev_sha"   # the fixture is only meaningful if they differ

          proj="$RUNNER_TEMP/pin"
          mkdir -p "$proj" && cd "$proj"
          git init -q . && git config user.email ci@example.com && git config user.name ci
          # The fixture sits on develop; without the pin the clone would take develop's tip.
          STACK_SOURCE_REPO="$fx" bash "$GITHUB_WORKSPACE/scripts/cursor-stack.sh" install skills-only 2>&1 | tee run.log
          grep -q "source: clone fallback @ main ${main_sha:0:12}" run.log
          ! grep -q "${dev_sha:0:12}" run.log
          echo "installer-linux: pin honored - took main ${main_sha:0:12}, not develop ${dev_sha:0:12}"

      # The route real consumers take. A local STACK_SOURCE_REPO can only test the fallback, so
      # build the same snapshot release.yml would publish, serve it, and install from it for real.
      - name: archive route - install from a served release snapshot
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rel="$RUNNER_TEMP/rel/releases/latest/download"
          mkdir -p "$rel"
          printf 'sha: %s\nref: main\nbuilt: ci\n' "$GITHUB_SHA" > RELEASE-SOURCE
          git archive --format=tar.gz --add-file=RELEASE-SOURCE -o "$rel/cursor-stack.tar.gz" HEAD
          rm -f RELEASE-SOURCE
          ( cd "$RUNNER_TEMP/rel" && nohup python3 -m http.server 8799 >/dev/null 2>&1 & )
          for i in $(seq 1 20); do curl -fsS -o /dev/null "http://localhost:8799/releases/latest/download/cursor-stack.tar.gz" && break || sleep 0.5; done

          proj="$RUNNER_TEMP/arch"
          mkdir -p "$proj" && cd "$proj"
          git init -q . && git config user.email ci@example.com && git config user.name ci
          STACK_SOURCE_REPO=http://localhost:8799 bash "$GITHUB_WORKSPACE/scripts/cursor-stack.sh" install 2>&1 | tee run.log

          grep -q 'source: release archive' run.log   # took the archive, NOT the clone fallback
          test "$(grep -c 'fetched ->' run.log)" = 0
          test "$(find "$proj/.cursor/skills" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" \
             = "$(find "$GITHUB_WORKSPACE/skills" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          # The stamp must come from the archive's RELEASE-SOURCE (an archive has no git history).
          grep -q "^source_commit=${GITHUB_SHA}$" "$proj/.cursor/cursor-stack.stamp"
          echo "installer-linux: archive route + RELEASE-SOURCE stamp OK"

  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Parse covers every branch, including the winget / WindowsApps paths no run reaches.
      - name: parse
        shell: pwsh
        run: |
          $errors = $null; $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE/scripts/cursor-stack.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { "line $($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          "parse clean - $($tokens.Count) tokens"

      - name: install -SkillsOnly into a throwaway project
        shell: pwsh
        env:
          STACK_SKILLS_REPO: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $proj = Join-Path $env:RUNNER_TEMP 'proj'
          New-Item -ItemType Directory -Path $proj -Force | Out-Null
          Set-Location $proj
          git init -q .
          git config user.email ci@example.com
          git config user.name ci
          & "$env:GITHUB_WORKSPACE/scripts/cursor-stack.ps1" install -SkillsOnly
          if ($LASTEXITCODE -ne 0) { throw "installer exited $LASTEXITCODE" }

          $expected = (Select-String -Path "$env:GITHUB_WORKSPACE/scripts/cursor-stack.ps1" `
            -Pattern "'envoydev/cursor-stack\|" -AllMatches).Count
          $actual = (Get-ChildItem -Path (Join-Path $proj '.cursor/skills') -Directory).Count
          "manifest entries: $expected | installed skill dirs: $actual"
          if ($actual -ne $expected) { throw "expected $expected skill dirs, got $actual" }
          if (-not (Test-Path (Join-Path $proj '.cursor/skills/create-ticket/SKILL.md'))) {
            throw 'create-ticket/SKILL.md missing'
          }
          'installer-windows: install path OK'

      - name: full install - one clone serves the whole tree, and stamps it
        shell: pwsh
        env:
          STACK_SOURCE_REPO: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The fallback clone is pinned to -b main; actions/checkout fetches only the triggering
          # ref, so point a local main at THIS commit - the pin is exercised and the fixture still
          # tests the artifacts under test. See the linux job for the full note.
          & git -C $env:GITHUB_WORKSPACE branch -f main HEAD

          $proj = Join-Path $env:RUNNER_TEMP 'full'
          New-Item -ItemType Directory -Path $proj -Force | Out-Null
          Set-Location $proj
          git init -q .
          git config user.email ci@example.com
          git config user.name ci
          & "$env:GITHUB_WORKSPACE/scripts/cursor-stack.ps1" install *>&1 | Tee-Object -FilePath run.log
          if ($LASTEXITCODE -ne 0) { throw "installer exited $LASTEXITCODE" }

          # The whole point of the source snapshot: ONE resolution, and every hook/rule/agent copied
          # out of it rather than fetched per-file. A regression here is silent, so assert it.
          $log = Get-Content run.log -Raw
          $srcs = ([regex]::Matches($log, 'source: (release archive|clone fallback)')).Count
          if ($srcs -ne 1) { throw "expected 1 source resolution, got $srcs" }
          # A local path has no releases, so this run IS the fallback route.
          if ($log -notmatch 'source: clone fallback') { throw 'expected the clone fallback for a local source path' }
          if ($log -match 'fetched ->') { throw 'a per-file fetch happened - the source snapshot was bypassed' }

          # lint already gates disk == manifest, so the repo's own dirs are the contract here.
          foreach ($kind in @(@('agents','*.md'), @('rules','*.mdc'), @('hooks','*.js'))) {
            $want = (Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE $kind[0]) -Filter $kind[1]).Count
            $got  = (Get-ChildItem -Path (Join-Path $proj ".cursor/$($kind[0])") -Filter $kind[1]).Count
            "$($kind[0]): repo=$want installed=$got"
            if ($want -ne $got) { throw "$($kind[0]): expected $want, got $got" }
          }

          # The stamp must name the commit actually installed - not a stale or invented one.
          $head = (& git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim()
          if (-not (Select-String -Path (Join-Path $proj '.cursor/cursor-stack.stamp') -Pattern "^source_commit=$head$" -Quiet)) {
            throw "stamp does not name HEAD ($head)"
          }
          'installer-windows: full tree + stamp OK'

      # The route real consumers take. This twin takes the .zip asset (Expand-Archive is native),
      # so the zip half of the release is only ever proven here.
      - name: archive route - install from a served release snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:GITHUB_WORKSPACE
          $rel = Join-Path $env:RUNNER_TEMP 'rel/releases/latest/download'
          New-Item -ItemType Directory -Path $rel -Force | Out-Null
          "sha: $env:GITHUB_SHA`nref: main`nbuilt: ci" | Set-Content -LiteralPath RELEASE-SOURCE -NoNewline
          & git archive --format=zip --add-file=RELEASE-SOURCE -o (Join-Path $rel 'cursor-stack.zip') HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }
          Remove-Item RELEASE-SOURCE -Force

          $srv = Start-Process python -ArgumentList '-m','http.server','8799' -WorkingDirectory (Join-Path $env:RUNNER_TEMP 'rel') -PassThru
          try {
            $ok = $false
            foreach ($i in 1..20) {
              try { Invoke-WebRequest -Uri 'http://localhost:8799/releases/latest/download/cursor-stack.zip' -OutFile $env:TEMP\probe.zip -UseBasicParsing -ErrorAction Stop; $ok = $true; break }
              catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ok) { throw 'fake release server never came up' }

            $proj = Join-Path $env:RUNNER_TEMP 'arch'
            New-Item -ItemType Directory -Path $proj -Force | Out-Null
            Set-Location $proj
            git init -q .; git config user.email ci@example.com; git config user.name ci
            $env:STACK_SOURCE_REPO = 'http://localhost:8799'
            & "$env:GITHUB_WORKSPACE/scripts/cursor-stack.ps1" install *>&1 | Tee-Object -FilePath run.log
            if ($LASTEXITCODE -ne 0) { throw "installer exited $LASTEXITCODE" }

            $log = Get-Content run.log -Raw
            if ($log -notmatch 'source: release archive') { throw 'did not take the archive route' }
            if ($log -match 'fetched ->') { throw 'a per-file fetch happened' }
            $want = (Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'skills') -Directory).Count
            $got  = (Get-ChildItem -Path (Join-Path $proj '.cursor/skills') -Directory).Count
            if ($want -ne $got) { throw "skills: expected $want, got $got" }
            # The stamp must come from the archive's RELEASE-SOURCE (an archive has no git history).
            if (-not (Select-String -Path (Join-Path $proj '.cursor/cursor-stack.stamp') -Pattern "^source_commit=$env:GITHUB_SHA$" -Quiet)) {
              throw 'stamp did not come from RELEASE-SOURCE'
            }
            'installer-windows: archive route + RELEASE-SOURCE stamp OK'
          }
          finally { if ($srv -and -not $srv.HasExited) { Stop-Process -Id $srv.Id -Force } }
